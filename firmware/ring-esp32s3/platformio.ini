; mcring ring firmware — ESP32-S3 (stage 0: Seeed XIAO ESP32S3 Sense, stage 1: custom board)
;
;   pio run -e xiao_esp32s3_sense -t upload      # flash the dev kit
;   pio device monitor -b 115200
;   pio test -e native                           # host unit tests (Morse / CRC / ADPCM / packets)
;
; The Arduino core 2.0.x (platform espressif32 6.x) is used because the esp32-camera driver and
; NimBLE-Arduino are known-good there. The community "pioarduino" platform (Arduino core 3.x)
; also works; see README.md.

[platformio]
default_envs = xiao_esp32s3_sense
src_dir = src
lib_dir = lib
test_dir = test

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=2
  -DMCRING_FW_VERSION=\"0.1.0\"
  -DCONFIG_NIMBLE_CPP_LOG_LEVEL=1
  ; NimBLE: one connection, bigger MTU, no deprecated 4.x security prompts
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=517
lib_deps =
  h2zero/NimBLE-Arduino@^2.3.0

; ---------------------------------------------------------------------------
; Stage 0: Seeed Studio XIAO ESP32S3 Sense (OV2640 camera + PDM mic on the Sense board)
; ---------------------------------------------------------------------------
[env:xiao_esp32s3_sense]
board = seeed_xiao_esp32s3
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags =
  ${env.build_flags}
  -DBOARD_XIAO_ESP32S3_SENSE
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; Stage 1: mcring v1 custom board (ESP32-S3-MINI-1U / NanoS3 class module, see hardware/pinmap.md)
; ---------------------------------------------------------------------------
[env:mcring_v1]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default.csv
build_flags =
  ${env.build_flags}
  -DBOARD_MCRING_V1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; Host-side unit tests of the shared C libraries (no hardware needed)
; ---------------------------------------------------------------------------
[env:native]
platform = native
framework =
lib_deps =
build_flags = -std=c++17 -DMCRING_NATIVE_TEST
build_src_filter = -<*>
test_framework = unity
lib_compat_mode = off
