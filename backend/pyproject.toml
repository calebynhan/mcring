[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcring-backend"
version = "0.2.0"
description = "mcring voice backend: spoken question (+ optional photo) -> LLM answer -> speech (mp3 / ring ADPCM)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "anthropic>=1.0",
  "pillow>=10.3",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]                 # STT/TTS providers and the optional provider=openai answer path
resample = ["numpy>=1.26"]                # polyphase resampler for ring-speaker audio (optional)
local-stt = ["faster-whisper>=1.0"]       # on-device speech-to-text (MCRING_STT_PROVIDER=local)
test = ["pytest>=8", "httpx>=0.27", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
