<svg viewBox="0 0 430 312" role="img" aria-label="Top view of the lid: four 6 by 18 mm copper electrodes E0 to E3 in a row along the finger with 1.5 mm gaps; swipe along the row, tap or hold anywhere; USB-C slot at the hand end." class="dwg dwg-top" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" color="#18211d"><defs><marker id="top-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="top-tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="0" markerHeight="0"><path d="M5,0 L5,10" stroke="currentColor"/></marker></defs><rect x="0" y="0" width="430" height="312" fill="#ffffff"/><rect x="50.0" y="50.0" width="272.0" height="200.0" rx="16.0" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.2"/><text x="186.0" y="68.4" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.75">tap · double tap · hold: anywhere</text><rect x="72.0" y="78.0" width="48.0" height="144.0" fill="#c8742e" fill-opacity="0.85" stroke="#c8742e" stroke-width="0.6"/><text x="96.0" y="237.2" font-size="11" text-anchor="middle" fill="currentColor" font-weight="600">E0</text><rect x="132.0" y="78.0" width="48.0" height="144.0" fill="#c8742e" fill-opacity="0.85" stroke="#c8742e" stroke-width="0.6"/><text x="156.0" y="237.2" font-size="11" text-anchor="middle" fill="currentColor" font-weight="600">E1</text><rect x="192.0" y="78.0" width="48.0" height="144.0" fill="#c8742e" fill-opacity="0.85" stroke="#c8742e" stroke-width="0.6"/><text x="216.0" y="237.2" font-size="11" text-anchor="middle" fill="currentColor" font-weight="600">E2</text><rect x="252.0" y="78.0" width="48.0" height="144.0" fill="#c8742e" fill-opacity="0.85" stroke="#c8742e" stroke-width="0.6"/><text x="276.0" y="237.2" font-size="11" text-anchor="middle" fill="currentColor" font-weight="600">E3</text><rect x="45.2" y="93.6