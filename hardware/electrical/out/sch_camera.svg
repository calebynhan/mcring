<text x="28" y="596.0" class="note">• FPC pin order = ESP32-CAM / Arducam M0031 OV2640 (pin 1 NC ... 24 Y0) — VERIFY on the purchased head.</text>
<text x="28" y="612.0" class="note">• FPC1 is a BOTTOM-contact back-flip connector (F32R-1A7H1-11024; alt Hirose FH12-24S-0.5SH, confirm contact side).</text>
<text x="28" y="628.0" class="note">• CAM_3V3 (DOVDD) switched by U2 from IO21; AVDD 2.8 V (U3) and DVDD 1.2 V (U4, DNP if self-regulated) hang off it.</text>
<text x="28" y="644.0" class="note">• SCCB pull-ups and RESET RC go to the switched rail so the unpowered sensor is never back-fed. PWDN tied low.</text>
<text x="28" y="660.0" class="note">• Y0/Y1 unused (8-bit bus Y2..Y9 = D0..D7). XCLK 20 MHz from IO10 (LEDC).</text>
