<text x="28" y="538.0" class="note">• DRV2605L: IN/TRIG to GND (I2C RTP mode), EN from IO3, REG 1 uF. LRA on OUT+/OUT-.</text>
<text x="28" y="554.0" class="note">• LIS2DW12: SA0 = GND (0x18), CS = VDD_IO (I2C), INT1 -&gt; IO7 (RTC wake), INT2 NC.</text>
<text x="28" y="570.0" class="note">• T3902: SELECT = GND, CLK IO42, DATA IO41 (I2S0 PDM RX). Button to GND with 100 nF; touch pad via 1k.</text>
