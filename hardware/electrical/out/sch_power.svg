<text x="28" y="568.0" class="note">• BQ25100: R_ISET 9.1k -&gt; ~25 mA (K_ISET 230 A*ohm, VERIFY); R_PRETERM 11.5k -&gt; 1 mA (K 11.5, VERIFY).</text>
<text x="28" y="584.0" class="note">• BQ25100 has PRE_TERM, no TS pin (TS variant = BQ25101). nCHG goes to a test pad only.</text>
<text x="28" y="600.0" class="note">• TPS62840: VSET resistor selects the 3.3 V code (SLVSE12 table, VERIFY); MODE/STOP low; EN tied to VBAT.</text>
<text x="28" y="616.0" class="note">• 100 uF 1206 bulk on 3V3 near the module absorbs the 300-370 mA capture/radio peaks.</text>
