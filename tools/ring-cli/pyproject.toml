[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcring-cli"
version = "0.2.0"
description = "Desktop companion for the mcring voice ring: push-to-talk, BLE bridge, backend client, simulator"
requires-python = ">=3.10"
dependencies = [
  "bleak>=0.22",
  "httpx>=0.27",
  "mcring-core",
]

[project.optional-dependencies]
mic = ["sounddevice>=0.4"]        # `mcring talk` with the laptop microphone
audio = ["simpleaudio>=1.0"]      # beeps for the legacy Morse player
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
mcring = "mcring_cli.cli:main"

[tool.setuptools.packages.find]
include = ["mcring_cli*"]
