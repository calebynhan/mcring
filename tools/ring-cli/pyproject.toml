[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcring-cli"
version = "0.1.0"
description = "Desktop companion for the mcring camera ring: BLE bridge, backend client, simulator"
requires-python = ">=3.10"
dependencies = [
  "bleak>=0.22",
  "httpx>=0.27",
  "mcring-core",
]

[project.optional-dependencies]
audio = ["simpleaudio>=1.0"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
mcring = "mcring_cli.cli:main"

[tool.setuptools.packages.find]
include = ["mcring_cli*"]
